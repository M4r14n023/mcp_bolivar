<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda & Llamados — MCP Bolívar</title>
<link rel="icon" type="image/jpeg" href="logo_mcp.png" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh}
.navbar{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;padding:0 1.25rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(13,148,136,.25)}
.nav-logo{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.main{flex:1;padding:1rem;max-width:960px;margin:0 auto;width:100%}
.card{background:#fff;border-radius:12px;border:.5px solid #e2e8f0;padding:1rem;margin-bottom:.75rem}

.search-wrap{position:relative;margin-bottom:.75rem}
.search-wrap input{width:100%;padding:9px 12px 9px 38px;border:.5px solid #cbd5e0;border-radius:8px;font-size:14px;background:#fff;outline:none}
.search-wrap input:focus{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#a0aec0}

.filter-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:.75rem}
.pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:.5px solid #cbd5e0;background:#fff;color:#4a5568;white-space:nowrap;transition:all .15s}
.pill.active{background:#0d9488;color:#fff;border-color:#0d9488}

.patient-card{background:#fff;border-radius:10px;border:.5px solid #e2e8f0;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.patient-card.is-confirmed{border-left:4px solid #16a34a;background:#f0fdf4}
.patient-card.is-no-viene{border-left:4px solid #dc2626;background:#fef2f2;opacity:.65}
.patient-card.is-avisado{border-left:4px solid #ea580c;background:#fff7ed}

.patient-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.patient-name{font-size:15px;font-weight:700;color:#1e293b;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.patient-sub{font-size:12px;color:#64748b;margin-top:2px}

.btn-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.btn{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:.5px solid #cbd5e0;background:#fff;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-wa{background:#25d366;color:#fff;border-color:#25d366}
.btn-wa:hover{background:#22c55e}
.btn-check{background:#fff;color:#16a34a;border-color:#86efac}
.btn-check.active{background:#16a34a;color:#fff;border-color:#16a34a}
.btn-warn{background:#fff;color:#ea580c;border-color:#fdba74}
.btn-warn.active{background:#ea580c;color:#fff;border-color:#ea580c}
.btn-danger{background:#fff;color:#dc2626;border-color:#fca5a5}
.btn-danger.active{background:#dc2626;color:#fff;border-color:#dc2626}

.badge-time{background:#dcfce7;color:#166534;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.badge-part{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:12px;width:100%;max-width:400px;padding:1.25rem;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:1rem;color:#1e293b}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem}

@media print {
  body, .app, .main { background: #fff !important; padding: 0 !important; }
  .navbar, .search-wrap, .filter-pills, .btn-actions, .no-print, button { display: none !important; }
  .card { border: none !important; padding: 0 !important; }
  .print-header { display: block !important; margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 6px; }
  .print-table { width: 100% !important; border-collapse: collapse !important; font-size: 12px !important; display: table !important; }
  .print-table th, .print-table td { border: 1px solid #cbd5e0 !important; padding: 6px 8px !important; text-align: left !important; }
  .print-table th { background: #f1f5f9 !important; }
  .patient-card { display: none !important; }
}
.print-header, .print-table { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const firebaseConfig = {
  apiKey: "AIzaSyARu0PMH_qW56Xur4Iri6z_wnKAncg5xnM",
  authDomain: "mcp-bolivar-cloud.firebaseapp.com",
  projectId: "mcp-bolivar-cloud",
  storageBucket: "mcp-bolivar-cloud.firebasestorage.app",
  messagingSenderId: "398348426481",
  appId: "1:398348426481:web:cca4a558deac9c01df1d50"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const firestore = firebase.firestore();

function AgendaApp() {
  const [patients, setPatients] = useState([]);
  const [agendaState, setAgendaState] = useState({});
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('todos'); // 'todos' | 'confirmados' | 'avisados' | 'noVienen' | 'particulares'
  const [loading, setLoading] = useState(true);

  const [fechaConsulta, setFechaConsulta] = useState(() => localStorage.getItem('mcp_agenda_fecha') || '');
  const [timeModalPatient, setTimeModalPatient] = useState(null);
  const [inputTime, setInputTime] = useState('');
  const [showPrintModal, setShowPrintModal] = useState(false);
  const [printType, setPrintType] = useState('consultorio'); // 'consultorio' | 'particulares'

  useEffect(() => {
    // 1. Escuchamos pacientes de mcp/main
    const unsubMain = firestore.collection('mcp').doc('main').onSnapshot(doc => {
      if (doc.exists) {
        const d = doc.data();
        if (Array.isArray(d.patients)) {
          setPatients(d.patients.filter(p => !p.fallecido));
        }
      }
      setLoading(false);
    });

    // 2. Escuchamos el estado del llamado de mcp/agenda
    const unsubAgenda = firestore.collection('mcp').doc('agenda').onSnapshot(doc => {
      if (doc.exists) {
        setAgendaState(doc.data().items || {});
      } else {
        setAgendaState({});
      }
    });

    return () => {
      unsubMain();
      unsubAgenda();
    };
  }, []);

  const savePatientState = async (patientId, newObj) => {
    const updated = {
      ...agendaState,
      [patientId]: {
        ...(agendaState[patientId] || {}),
        ...newObj
      }
    };
    setAgendaState(updated);
    try {
      await firestore.collection('mcp').doc('agenda').set({ items: updated }, { merge: true });
    } catch (err) {
      console.error("Error guardando estado de agenda:", err);
    }
  };

  const handleDateChange = (val) => {
    setFechaConsulta(val);
    localStorage.setItem('mcp_agenda_fecha', val);
  };

  const sendWhatsApp = (p) => {
    let phone = `${p.telPrefix || ''}${p.telNum || ''}`.replace(/\D/g, '');
    if (phone.length >= 10 && !phone.startsWith('54')) phone = `549${phone}`;
    
    const contactName = p.telOwner === 'Paciente' ? p.nombre : (p.telContact || 'Familiar');
    const fechaTxt = fechaConsulta ? ` el *${fechaConsulta}*` : ' en la próxima fecha';
    const msg = `Hola ${contactName}, nos comunicamos de MCP Bolívar para coordinar el próximo control de marcapasos${fechaTxt}. ¿Podrás asistir? Aguardamos tu confirmación.`;
    
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  const updateStatus = (patient, field) => {
    const st = agendaState[patient.id] || {};
    const current = !!st[field];

    if (field === 'confirmado') {
      if (!current) {
        // Al querer confirmar, pedimos horario y apagaremos Avisado y No viene
        setInputTime(st.time || '');
        setTimeModalPatient(patient);
      } else {
        // Desmarcar confirmado -> vuelve a sin estado
        savePatientState(patient.id, { confirmado: false, time: '' });
      }
    } else if (field === 'noViene') {
      if (!current) {
        // Activar No viene -> apaga confirmado (borra hora) y apaga avisado
        savePatientState(patient.id, {
          noViene: true,
          confirmado: false,
          avisado: false,
          time: ''
        });
      } else {
        // Desmarcar No viene -> vuelve a sin estado
        savePatientState(patient.id, { noViene: false });
      }
    } else if (field === 'avisado') {
      if (!current) {
        // Activar Avisado -> apaga confirmado (borra hora) y apaga No viene
        savePatientState(patient.id, {
          avisado: true,
          confirmado: false,
          noViene: false,
          time: ''
        });
      } else {
        // Desmarcar Avisado -> vuelve a sin estado
        savePatientState(patient.id, { avisado: false });
      }
    }
  };

  const confirmTimeAssignment = () => {
    if (!timeModalPatient) return;
    // Confirmar turno apaga automáticamente avisado y noViene
    savePatientState(timeModalPatient.id, {
      confirmado: true,
      time: inputTime.trim(),
      avisado: false,
      noViene: false
    });
    setTimeModalPatient(null);
    setInputTime('');
  };

  // Enriquecemos cada paciente con su estado actual de llamada
  const enrichedList = useMemo(() => {
    return patients.map(p => {
      const st = agendaState[p.id] || {};
      return {
        ...p,
        confirmado: !!st.confirmado,
        avisado: !!st.avisado,
        noViene: !!st.noViene,
        time: st.time || ''
      };
    });
  }, [patients, agendaState]);

  // Contadores para las píldoras
  // Contadores exactos y mutuamente excluyentes
  const counts = useMemo(() => {
    let conf = 0, avis = 0, noV = 0, sinLlamar = 0, part = 0;
    enrichedList.forEach(p => {
      if (p.particular) part++;
      if (p.noViene) {
        noV++;
      } else if (p.confirmado) {
        conf++;
      } else if (p.avisado) {
        avis++;
      } else {
        sinLlamar++;
      }
    });
    return { conf, avis, noV, sinLlamar, part, total: enrichedList.length };
  }, [enrichedList]);

  // Filtrado reactivo sin solapamientos
  const filtered = useMemo(() => {
    return enrichedList.filter(p => {
      const q = search.trim().toLowerCase();
      const matchSearch = !q || (p.apellido + ' ' + p.nombre).toLowerCase().includes(q);
      if (!matchSearch) return false;

      if (filter === 'confirmados') return p.confirmado && !p.noViene;
      if (filter === 'avisados') return p.avisado && !p.confirmado && !p.noViene;
      if (filter === 'noVienen') return p.noViene;
      if (filter === 'sinLlamar') return !p.confirmado && !p.avisado && !p.noViene;
      if (filter === 'particulares') return p.particular;
      return true;
    }).sort((a, b) => {
      if (filter === 'confirmados' && a.time && b.time) {
        return a.time.localeCompare(b.time);
      }
      return (a.apellido + a.nombre).localeCompare(b.apellido + b.nombre, 'es');
    });
  }, [enrichedList, search, filter]);

  // Listas preparadas para impresión
  const printConsultorioList = useMemo(() => {
    return enrichedList
      .filter(p => !p.particular && p.confirmado)
      .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  }, [enrichedList]);

  const printParticularesList = useMemo(() => {
    return enrichedList
      .filter(p => p.particular && p.confirmado)
      .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  }, [enrichedList]);

  if (loading) {
    return (
      <div style={{display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', color:'#0d9488', fontWeight:600}}>
        Cargando Agenda MCP Bolívar...
      </div>
    );
  }

  return (
    <div className="app">
      <nav className="navbar no-print">
        <div className="nav-logo">
          <img src="logo_mcp.png" alt="Logo" style={{width:26, height:26, borderRadius:'50%'}} />
          Agenda & Llamados
        </div>
        <div style={{display:'flex', gap:8}}>
          <button className="btn" style={{background:'rgba(255,255,255,0.2)', color:'#fff', border:'none'}} onClick={() => { setPrintType('consultorio'); setShowPrintModal(true); }}>
            🖨 Consultorio ({printConsultorioList.length})
          </button>
          <button className="btn" style={{background:'rgba(255,255,255,0.2)', color:'#fff', border:'none'}} onClick={() => { setPrintType('particulares'); setShowPrintModal(true); }}>
            🏠 Domicilios ({printParticularesList.length})
          </button>
        </div>
      </nav>

      <div className="main">
        {/* BARRA SUPERIOR DE FECHA */}
        <div className="card no-print" style={{display:'flex', gap:10, alignItems:'center', flexWrap:'wrap', background:'#f8fafc'}}>
          <span style={{fontSize:13, fontWeight:600, color:'#475569'}}>📅 Fecha de la jornada:</span>
          <input 
            type="text" 
            placeholder="Ej: Jueves 15 de Octubre" 
            value={fechaConsulta} 
            onChange={e => handleDateChange(e.target.value)}
            style={{padding:'6px 10px', borderRadius:6, border:'1px solid #cbd5e0', fontSize:13, flex:1, maxWidth:260}}
          />
        </div>

        {/* BUSCADOR */}
        <div className="search-wrap no-print">
          <span className="search-icon">🔍</span>
          <input 
            value={search} 
            onChange={e => setSearch(e.target.value)} 
            placeholder="Buscar por apellido o nombre..." 
          />
        </div>

        {/* PÍLDORAS DE FILTRADO */}
        <div className="filter-pills no-print">
          <button className={`pill ${filter === 'todos' ? 'active' : ''}`} onClick={() => setFilter('todos')}>
            Todos ({counts.total})
          </button>
          <button className={`pill ${filter === 'sinLlamar' ? 'active' : ''}`} onClick={() => setFilter('sinLlamar')}>
            ⚪ Sin llamar ({counts.sinLlamar})
          </button>
          <button className={`pill ${filter === 'avisados' ? 'active' : ''}`} onClick={() => setFilter('avisados')}>
            ⏳ Avisados ({counts.avis})
          </button>
          <button className={`pill ${filter === 'confirmados' ? 'active' : ''}`} onClick={() => setFilter('confirmados')}>
            ✓ Confirmados ({counts.conf})
          </button>
          <button className={`pill ${filter === 'noVienen' ? 'active' : ''}`} onClick={() => setFilter('noVienen')}>
            ✕ No vienen ({counts.noV})
          </button>
          <button className={`pill ${filter === 'particulares' ? 'active' : ''}`} onClick={() => setFilter('particulares')}>
            🏠 Particulares ({counts.part})
          </button>
        </div>

        {/* LISTADO DE PACIENTES */}
        <div className="no-print">
          {filtered.length === 0 && (
            <div style={{textAlign:'center', padding:'3rem', color:'#94a3b8'}}>
              No se encontraron pacientes para este filtro.
            </div>
          )}

          {filtered.map(p => (
            <div 
              key={p.id} 
              className={`patient-card ${p.confirmado ? 'is-confirmed' : ''} ${p.noViene ? 'is-no-viene' : ''} ${p.avisado && !p.confirmado ? 'is-avisado' : ''}`}
            >
              <div className="patient-header">
                <div>
                  <div className="patient-name" style={{textDecoration: p.noViene ? 'line-through' : 'none'}}>
                    {p.apellido}, {p.nombre}
                    {p.particular && <span className="badge-part">🏠 Particular</span>}
                    {p.time && <span className="badge-time">⏰ {p.time} hs</span>}
                  </div>
                  <div className="patient-sub">
                    📞 {p.telPrefix} {p.telNum} {p.telOwner !== 'Paciente' ? `(${p.telOwner}: ${p.telContact})` : ''} · {p.brand || 'Sin marca'}
                  </div>
                  {p.ausenciasCount > 0 && !p.noViene && (
                    <div style={{fontSize:11, color:'#c2410c', fontWeight:600, marginTop:2}}>
                      ⚠️ Registra {p.ausenciasCount} {p.ausenciasCount === 1 ? 'inasistencia previa' : 'inasistencias previas'}
                      {p.ultimaAusencia ? ` (${p.ultimaAusencia})` : ''}
                    </div>
                  )}
                </div>
              </div>

              <div className="btn-actions">
                <button className="btn btn-wa" onClick={() => sendWhatsApp(p)}>
                  📱 WhatsApp
                </button>
                <button 
                  className={`btn btn-check ${p.confirmado ? 'active' : ''}`} 
                  onClick={() => updateStatus(p, 'confirmado')}
                >
                  {p.confirmado ? `✓ Confirmado (${p.time || 'sin hora'})` : 'Confirmar'}
                </button>
                <button 
                  className={`btn btn-warn ${p.avisado ? 'active' : ''}`} 
                  onClick={() => updateStatus(p, 'avisado')}
                >
                  {p.avisado ? '✓ Avisado' : 'Avisar'}
                </button>
                <button 
                  className={`btn btn-danger ${p.noViene ? 'active' : ''}`} 
                  onClick={() => updateStatus(p, 'noViene')}
                >
                  {p.noViene ? '✕ No viene' : 'No viene'}
                </button>
              </div>
            </div>
          ))}
        </div>

        {/* MODAL ASIGNAR HORARIO */}
        {timeModalPatient && (
          <div className="modal-overlay no-print">
            <div className="modal">
              <div className="modal-title">⏰ Asignar Horario</div>
              <p style={{fontSize:13, color:'#64748b', marginBottom:12}}>
                Paciente: <strong>{timeModalPatient.apellido}, {timeModalPatient.nombre}</strong>
              </p>
              <input 
                type="text" 
                placeholder="Ej: 14:30 o 15:00" 
                value={inputTime} 
                onChange={e => setInputTime(e.target.value)}
                autoFocus
                style={{width:'100%', padding:'9px 12px', border:'1px solid #cbd5e0', borderRadius:8, fontSize:14}}
              />
              <div className="modal-footer">
                <button className="btn" onClick={() => setTimeModalPatient(null)}>Cancelar</button>
                <button className="btn" style={{background:'#16a34a', color:'#fff', borderColor:'#16a34a'}} onClick={confirmTimeAssignment}>
                  Confirmar Turno
                </button>
              </div>
            </div>
          </div>
        )}

        {/* MODAL VISTA PREVIA IMPRESIÓN */}
        {showPrintModal && (
          <div className="modal-overlay no-print">
            <div className="modal" style={{maxWidth:600}}>
              <div className="modal-title">
                {printType === 'consultorio' ? '📋 Planilla de Consultorio' : '🏠 Planilla de Domicilios'}
              </div>
              <p style={{fontSize:13, color:'#64748b', marginBottom:10}}>
                Total confirmados: {printType === 'consultorio' ? printConsultorioList.length : printParticularesList.length}
              </p>
              <div style={{maxHeight:300, overflowY:'auto', border:'1px solid #e2e8f0', borderRadius:8, padding:8, marginBottom:12, fontSize:12}}>
                {(printType === 'consultorio' ? printConsultorioList : printParticularesList).map((p, i) => (
                  <div key={p.id} style={{padding:'4px 0', borderBottom:'1px solid #f1f5f9', display:'flex', justifyContent:'space-between'}}>
                    <span><strong>{p.time || '—'}</strong> · {p.apellido}, {p.nombre}</span>
                    <span style={{color:'#64748b'}}>{printType === 'particulares' ? `${p.street || ''} ${p.streetNum || ''}` : p.brand}</span>
                  </div>
                ))}
              </div>
              <div className="modal-footer">
                <button className="btn" onClick={() => setShowPrintModal(false)}>Cerrar</button>
                <button className="btn" style={{background:'#0d9488', color:'#fff', borderColor:'#0d9488'}} onClick={() => window.print()}>
                  🖨 Mandar a Imprimir
                </button>
              </div>
            </div>
          </div>
        )}

        {/* VISTAS EXCLUSIVAS PARA IMPRESORA */}
        <div className="print-header">
          <h2>MCP Bolívar — {printType === 'consultorio' ? 'Planilla de Consultorio' : 'Controles a Domicilio (Particulares)'}</h2>
          <div>Fecha: {fechaConsulta || 'Jornada Programada'}</div>
        </div>

        <table className="print-table">
          <thead>
            <tr>
              <th style={{width:60}}>Hora</th>
              <th>Paciente</th>
              {printType === 'particulares' ? <th>Dirección</th> : <th>Marca / Disp.</th>}
              <th>Teléfono</th>
              <th style={{width:100}}>Firma / Observación</th>
            </tr>
          </thead>
          <tbody>
            {(printType === 'consultorio' ? printConsultorioList : printParticularesList).map(p => (
              <tr key={p.id}>
                <td><strong>{p.time || '—'}</strong></td>
                <td>{p.apellido}, {p.nombre}</td>
                {printType === 'particulares' ? (
                  <td>{`${p.street || ''} ${p.streetNum || ''}`.trim() || '—'} ({p.city})</td>
                ) : (
                  <td>{p.brand || '—'} ({p.deviceType})</td>
                )}
                <td>{p.telPrefix} {p.telNum}</td>
                <td></td>
              </tr>
            ))}
          </tbody>
        </table>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AgendaApp />);
</script>
</body>
</html>
