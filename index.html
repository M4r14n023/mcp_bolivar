<style>

.dialog-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(3px); animation: fadeIn 0.15s ease-out; }

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ANIMACIÓN ECG / LATIDO CARDIACO */
.ecg-loader-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
}
.ecg-heart-icon {
  font-size: 38px;
  animation: heartPulse 1.1s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
  filter: drop-shadow(0 4px 10px rgba(229, 62, 62, 0.35));
}
.ecg-svg-box {
  width: 240px;
  height: 60px;
  overflow: hidden;
}
.ecg-line {
  stroke: #1a56db;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  stroke-dasharray: 450;
  stroke-dashoffset: 450;
  animation: ecgSweep 1.6s ease-in-out infinite;
}
.ecg-label {
  font-size: 13px;
  font-weight: 600;
  color: #1a56db;
  letter-spacing: 0.5px;
}

@keyframes heartPulse {
  0% { transform: scale(1); }
  14% { transform: scale(1.22); }
  28% { transform: scale(1); }
  42% { transform: scale(1.15); }
  70% { transform: scale(1); }
}

@keyframes ecgSweep {
  0% { stroke-dashoffset: 450; opacity: 0.2; }
  15% { opacity: 1; }
  75% { stroke-dashoffset: 0; opacity: 1; }
  90% { stroke-dashoffset: 0; opacity: 0; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}

  .desktop-table { display: none !important; }

  /* Tarjetas móviles verticales */
  .mobile-cards-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 0;
  }
  .mobile-patient-card {
    background: #fff;
    border-radius: 10px;
    border: 0.5px solid #e2e8f0;

    display: flex;

  }
  .mobile-patient-card:active {
    transform: scale(0.99);
    border-color: #1a56db;
  }
  .mobile-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .mobile-card-title {
    display: flex;
    align-items: center;

    font-size: 14px;

    background: #f8fafc;

  }
  .mobile-card-body div {

  .modal-overlay { padding: 0 !important; }

  }

}

/* En monitores de computadora ocultamos las tarjetas móviles y el botón hamburguesa */
@media(min-width: 641px) {

@media print {
  html, body, .app, #root, .main { height: auto !important; min-height: auto !important; overflow: visible !important; position: static !important; background: white !important; }

  table { width: 100% !important; page-break-inside: auto; border-collapse: collapse !important; }
  tr { page-break-inside: avoid !important; page-break-after: auto !important; }
}

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

const APP_VERSION = "3.0.0 (Cloud Sync)";

const firebaseConfig = {
  apiKey: "AIzaSyARu0PMH_qW56Xur4Iri6z_wnKAncg5xnM",
  authDomain: "mcp-bolivar-cloud.firebaseapp.com",
  projectId: "mcp-bolivar-cloud",
  storageBucket: "mcp-bolivar-cloud.firebasestorage.app",
  messagingSenderId: "398348426481",
  appId: "1:398348426481:web:cca4a558deac9c01df1d50"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const firestore = firebase.firestore();

function getGeminiKey() { return localStorage.getItem('mcp_gemini_key') || ''; }
function setGeminiKey(key) { localStorage.setItem('mcp_gemini_key', key); }

const DEFAULT = {
  patients: [],
  cities: ['Bolívar', 'Henderson', 'Pirovano', 'Urdampilleta'],
  streets: [],
  deviceTypes: ['Desfibrilador', 'Marcapasos', 'Resincronizador'],
  brands: ['Biotronik', 'Boston Scientific', 'Medtronic', 'Sorin', 'ST Jude'],
  modes: [],
  finances: { sessions: [], currentSession: null }
};

const sortArr = arr => [...new Set(arr)].filter(Boolean).sort((a,b)=>a.localeCompare(b,'es'));

const DialogContext = React.createContext(null);

function DialogProvider({ children }) {
  const [dialog, setDialog] = useState(null);

  const showConfirm = useCallback(({ title = '¿Confirmar acción?', message, confirmText = 'Aceptar', cancelText = 'Cancelar', isDanger = false }) => {
    return new Promise((resolve) => {
      setDialog({
        type: 'confirm', title, message, confirmText, cancelText, isDanger,
        onConfirm: () => { setDialog(null); resolve(true); },
        onCancel: () => { setDialog(null); resolve(false); }
      });
    });
  }, []);

  const showAlert = useCallback(({ title = 'Atención', message, buttonText = 'Entendido' }) => {
    return new Promise((resolve) => {
      setDialog({
        type: 'alert', title, message, buttonText,
        onConfirm: () => { setDialog(null); resolve(true); }
      });
    });
  }, []);

  return (
    <DialogContext.Provider value={{ showConfirm, showAlert }}>
      {children}
      {dialog && (
        <div className="dialog-overlay no-print">
          <div className="dialog-box">
            <div className="dialog-header">
              <span>{dialog.isDanger ? '⚠️' : dialog.type === 'confirm' ? '❓' : 'ℹ️'}</span>
              <span>{dialog.title}</span>
            </div>
            <div className="dialog-msg">{dialog.message}</div>
            <div className="dialog-actions">
              {dialog.type === 'confirm' && (
                <button className="btn" onClick={dialog.onCancel}>{dialog.cancelText}</button>
              )}
              <button className={`btn ${dialog.isDanger ? 'btn-danger' : 'btn-primary'}`} onClick={dialog.onConfirm} autoFocus>
                {dialog.type === 'confirm' ? dialog.confirmText : dialog.buttonText}
              </button>
            </div>
          </div>
        </div>
      )}
    </DialogContext.Provider>
  );
}

function useDialog() { return React.useContext(DialogContext); }

function calcAge(dob){
  if(!dob||dob.length<10)return null;
  const[d,m,y]=dob.split('/');
  if(!d||!m||!y||y.length<4)return null;
  const birth=new Date(+y,+m-1,+d);
  if(isNaN(birth.getTime()))return null;
  const now=new Date();
  let age=now.getFullYear()-birth.getFullYear();
  const md=now.getMonth()-birth.getMonth();
  if(md<0||(md===0&&now.getDate()<birth.getDate()))age--;
  return age<0||age>130?null:age;
}

function formatDOB(val){
  const digits=val.replace(/\D/g,'');
  let out='';
  for(let i=0;i<digits.length&&i<8;i++){
    if(i===2||i===4)out+='/';
    out+=digits[i];
  }
  return out;
}

function todayStr(){
  const t=new Date();
  return`${String(t.getDate()).padStart(2,'0')}/${String(t.getMonth()+1).padStart(2,'0')}/${t.getFullYear()}`;
}

function batteryDisplay(p){
  if(!p)return'—';
  if(p.batteryType==='time'){
    const y=p.batteryYears??'';const m=p.batteryMonths??'';
    if(y===''&&m==='')return'—';
    return`${y!==''?y+'a ':''} ${m!==''?m+'m':''}`.trim();
  }
  return p.batteryPct!==''&&p.batteryPct!==undefined?`${p.batteryPct}%`:'—';
}

function batteryColor(p){
  if(p.batteryType==='percent'){
    const v=parseFloat(p.batteryPct);
    if(isNaN(v))return'badge-gray';
    if(v>=50)return'badge-green';
    if(v>=25)return'badge-yellow';
    return'badge-red';
  }
  return'badge-blue';
}

function ACInput({value,onChange,list,placeholder}){
  const[show,setShow]=useState(false);
  const[opts,setOpts]=useState([]);
  const ref=useRef(null);
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setShow(false)};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  function handleChange(e){
    const v=e.target.value;
    onChange(v);
    if(v.length>0){
      const f=list.filter(x=>x.toLowerCase().includes(v.toLowerCase())&&x.toLowerCase()!==v.toLowerCase());
      setOpts(f);setShow(f.length>0);
    }else{setShow(false)}
  }
  return(
    <div className="autocomplete-wrap" ref={ref}>
      <input value={value} onChange={handleChange} onFocus={()=>{if(value.length>0&&opts.length>0)setShow(true)}} placeholder={placeholder||''}/>
      {show&&(
        <div className="autocomplete-list">
          {opts.map(x=>(
            <div key={x} className="autocomplete-item" onMouseDown={e=>{e.preventDefault();onChange(x);setShow(false)}}>{x}</div>
          ))}
        </div>
      )}
    </div>
  );
}

function AIReportGenerator({patient, onClose}) {
  const [step, setStep] = useState(1);
  const [status, setStatus] = useState('');
  const [dragging, setDragging] = useState(false);
  const [pdfFiles, setPdfFiles] = useState([]);
  const [pdfUrl, setPdfUrl] = useState(null);
  const [showViewer, setShowViewer] = useState(false);
  
  const [form, setForm] = useState({modo: patient.mode || '', impA: '', impV: '', impShock: '', batteryType: patient.batteryType || 'percent', batteryPct: patient.batteryPct || '', batteryYears: patient.batteryYears || '', batteryMonths: patient.batteryMonths || '', isERI: false, isEOL: false, estimV: '', arrPMT: false, arrModo: false, arrRuido: false, arrOtros: '', conclusion: '', nextControl: ''});
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const apiKey = getGeminiKey();

  useEffect(() => { if (pdfFiles.length > 0) { const url = URL.createObjectURL(pdfFiles[0]); setPdfUrl(url); return () => URL.revokeObjectURL(url); } }, [pdfFiles]);

  useEffect(() => {
    if (step !== 2) return; 
    let conc = "Parámetros de funcionamiento dentro de límites normales."; let ctrl = "6 a 8 meses";
    if (form.isEOL) { conc = "Dispositivo en Indicación de Recambio Inmediato."; ctrl = "Programar recambio"; }
    else if (form.isERI) { conc = "Dispositivo con Indicación de Recambio alcanzada."; ctrl = "Programar recambio"; }
    else {
      const arrs = []; if(form.arrPMT) arrs.push("PMT"); if(form.arrModo) arrs.push("Cambios de Modo"); if(form.arrRuido) arrs.push("Ruido Auricular"); if(form.arrOtros) arrs.push(form.arrOtros);
      if (arrs.length > 0) conc += ` Se detectaron episodios de: ${arrs.join(', ')}.`;
      let isLow = false;
      if (form.batteryType === 'percent' && parseFloat(form.batteryPct) < 30) isLow = true;
      if (form.batteryType === 'time' && (parseInt(form.batteryYears)||0) < 1) isLow = true;
      if (isLow) ctrl = "3 meses";
    }
    set('conclusion', conc); set('nextControl', ctrl);
  }, [form.isERI, form.isEOL, form.arrPMT, form.arrModo, form.arrRuido, form.arrOtros, form.batteryType, form.batteryPct, form.batteryYears, form.batteryMonths, step]);

  async function handleFileUpload(files) {
    const arr = Array.from(files).filter(f => f.type === 'application/pdf');
    if(arr.length === 0) return;
    const mainFile = arr[0]; setPdfFiles(prev => [...prev, ...arr]);
    if(!apiKey) { if(window.confirm('No tienes configurada la API Key de Gemini. ¿Quieres llenar el formulario manualmente?')) setStep(2); return; }
    setStatus('leyendo');
    try {
      const arrayBuffer = await mainFile.arrayBuffer(); const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
      let fullText = ''; for (let i = 1; i <= pdf.numPages; i++) { const page = await pdf.getPage(i); const textContent = await page.getTextContent(); fullText += textContent.items.map(item => item.str).join(' ') + ' \n'; }
      setStatus('ia');
      const prompt = `Actúa como un técnico experto en marcapasos. Analiza TODO este texto extraído de un informe de dispositivo cardíaco (puede ser Biotronik, Medtronic, Abbott, etc.). 
      IMPORTANTE: La información suele estar muy dispersa. Revisa desde la primera hasta la última línea.
      Devuelve ÚNICAMENTE un objeto JSON válido con esta estructura exacta:
      {"modo": "modo o vacío", "impA": "valor o vacío", "impV": "valor o vacío", "impShock": "valor o vacío", "estimV": "valor o vacío", "eri": true o false, "eol": true o false}
      Texto completo a analizar: ${fullText}`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
      if (!response.ok) throw new Error(`Error de conexión con IA`);
      const data = await response.json(); if(!data.candidates) throw new Error("Error IA.");
      let jsonText = data.candidates[0].content.parts[0].text;
      const jsonMatch = jsonText.match(/\{[\s\S]*\}/); if (jsonMatch) jsonText = jsonMatch[0];
      const result = JSON.parse(jsonText);
      setForm(prev => ({...prev, modo: result.modo || prev.modo || '', impA: result.impA || '', impV: result.impV || '', impShock: result.impShock || '', estimV: result.estimV || '', isERI: result.eri || false, isEOL: result.eol || false}));
      setStep(2); 
    } catch(err) { setStatus('Error procesando el PDF. Puedes completar los datos manualmente.'); setTimeout(() => setStep(2), 2000); }
  }

  async function generateFinalPDF() {
    try {
      setStatus('generando'); const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      doc.setFillColor(26, 86, 219); doc.rect(0, 0, 210, 30, 'F'); doc.setTextColor(255, 255, 255); doc.setFontSize(20); doc.setFont('helvetica', 'bold'); doc.text('Informe de Control de Dispositivo', 14, 18); doc.setFontSize(10); doc.setFont('helvetica', 'normal'); doc.text(`Sede: Bolívar — Fecha: ${todayStr()}`, 14, 25);
      doc.setTextColor(26, 32, 44); doc.setFontSize(14); doc.setFont('helvetica', 'bold'); doc.text(`Paciente: ${patient.apellido}, ${patient.nombre}`, 14, 45); doc.setFontSize(11); doc.setFont('helvetica', 'normal'); doc.text(`Dispositivo: ${patient.deviceType} ${patient.brand} (${form.modo || 'N/A'})`, 14, 52);
      const age = calcAge(patient.dob); if(age) doc.text(`Edad: ${age} años`, 14, 58);

  const patient=db.patients.find(p=>p.id===patientId);
  if(!patient)return null;
  const age=calcAge(patient.dob);

    const ok = await showConfirm({ title: 'Eliminar Consulta', message: '¿Estás seguro de que deseas eliminar este registro de consulta?', confirmText: 'Eliminar', isDanger: true });

function FinanceModule({db,setDB}){
  const { showConfirm, showAlert } = useDialog();

  const[consultaVal,setConsultaVal]=useState('');
  const[alquilerVal,setAlquilerVal]=useState('');
  const fin=db.finances||{sessions:[],currentSession:null};
  const cs=fin.currentSession;

  async function start(){
    const cv=parseFloat(consultaVal);const av=parseFloat(alquilerVal);
    if(isNaN(cv)||cv<=0||isNaN(av)||av<=0){ await showAlert({title: 'Error', message: 'Ingresá valores válidos.'}); return; }
    setDB({...db,finances:{...fin,currentSession:{id:Date.now().toString(),date:todayStr(),consultaVal:cv,alquilerVal:av,count:0}}});
    setShowOpen(false);setConsultaVal('');setAlquilerVal('');
  }

  async function close(){
    if(!cs)return;
    const ok = await showConfirm({title: 'Cerrar Jornada', message: `¿Cerrar jornada con ${cs.count} pacientes?`, confirmText: 'Cerrar'});
    if(!ok) return;
    const totalRecaudado = cs.consultaVal * cs.count;
    setDB({...db,finances:{sessions:[...(fin.sessions||[]),{...cs,total: totalRecaudado,gananciaMio: totalRecaudado * 0.8,gananciaSec: totalRecaudado * 0.2,costoMio: cs.alquilerVal * 0.8,costoSec: cs.alquilerVal * 0.2,closedAt:new Date().toISOString()}],currentSession:null}});
  }

  async function deleteSession(sid){
    const ok = await showConfirm({title: 'Eliminar', message: '¿Eliminar este registro?', isDanger: true});
    if(!ok) return;
    setDB({...db,finances:{...fin,sessions:(fin.sessions||[]).filter(s=>s.id!==sid)}});
  }

  const sessions=[...(fin.sessions||[])].reverse();
  return(
    <div>
      {showOpen&&(<div className="modal-overlay"><div className="modal modal-sm"><div className="modal-header"><span className="modal-title">Abrir Jornada</span><button className="btn btn-sm" onClick={()=>setShowOpen(false)}>✕</button></div><div className="modal-body"><div className="form-group"><label>Valor Consulta ($)</label><input type="number" value={consultaVal} onChange={e=>setConsultaVal(e.target.value)} autoFocus/></div><div className="form-group"><label>Valor Alquiler ($)</label><input type="number" value={alquilerVal} onChange={e=>setAlquilerVal(e.target.value)}/></div></div><div className="modal-footer"><button className="btn" onClick={()=>setShowOpen(false)}>Cancelar</button><button className="btn btn-primary" onClick={start}>Abrir Jornada</button></div></div></div>)}
      {cs ? (
        <div className="card finance-active">

          <div className="grid2">
            <div style={{background: '#f8fafc', padding: '12px', borderRadius: '10px'}}><div style={{fontSize: '11px', fontWeight: '700', color: '#64748b', marginBottom: '8px'}}>RECAUDACIÓN</div><div style={{display:'flex', justifyContent:'space-between'}}><span style={{fontSize:'13px'}}>Total:</span><strong>${(cs.consultaVal * cs.count).toLocaleString('es-AR')}</strong></div><div style={{display:'flex', justifyContent:'space-between', color:'#166534'}}><span style={{fontSize:'13px'}}>Mío (80%):</span><strong>${(cs.consultaVal * cs.count * 0.8).toLocaleString('es-AR')}</strong></div><div style={{display:'flex', justifyContent:'space-between', color:'#92400e'}}><span style={{fontSize:'13px'}}>Sec (20%):</span><strong>${(cs.consultaVal * cs.count * 0.2).toLocaleString('es-AR')}</strong></div></div>
            <div style={{background: '#f8fafc', padding: '12px', borderRadius: '10px'}}><div style={{fontSize: '11px', fontWeight: '700', color: '#64748b', marginBottom: '8px'}}>GASTO ALQUILER</div><div style={{display:'flex', justifyContent:'space-between'}}><span style={{fontSize:'13px'}}>Total:</span><strong>${cs.alquilerVal.toLocaleString('es-AR')}</strong></div><div style={{display:'flex', justifyContent:'space-between', color:'#991b1b'}}><span style={{fontSize:'13px'}}>Mi aporte (80%):</span><strong>-${(cs.alquilerVal * 0.8).toLocaleString('es-AR')}</strong></div><div style={{display:'flex', justifyContent:'space-between', color:'#991b1b'}}><span style={{fontSize:'13px'}}>Sec aporte (20%):</span><strong>-${(cs.alquilerVal * 0.2).toLocaleString('es-AR')}</strong></div></div>
          </div>
          <div style={{marginTop: '15px', paddingTop: '10px', borderTop: '1px dashed #cbd5e0', textAlign: 'center'}}><div style={{fontSize: '12px', color: '#64748b'}}>Ganancia Neta Personal:</div><div style={{fontSize: '22px', fontWeight: '800', color: '#1a56db'}}>${( (cs.consultaVal * cs.count * 0.8) - (cs.alquilerVal * 0.8) ).toLocaleString('es-AR')}</div></div>
        </div>
      ) : (<div className="card" style={{textAlign:'center',padding:'2rem'}}><div style={{fontSize:40,marginBottom:'.5rem'}}>💼</div><p style={{color:'#718096',marginBottom:'1rem'}}>No hay jornada activa</p><button className="btn btn-primary" onClick={()=>setShowOpen(true)}>Abrir Jornada</button></div>)}
      <div className="card"><div className="card-title">📊 Historial</div><div className="table-wrap"><table><thead><tr><th>Fecha</th><th>Recaudado</th><th>Mío (80%)</th><th>Sec (20%)</th><th>Alq.</th><th>Neto Mío</th><th></th></tr></thead><tbody>{sessions.map(s => (<tr key={s.id}><td>{s.date}</td><td>${(s.total||0).toLocaleString('es-AR')}</td><td style={{color:'#166534'}}>${(s.total * 0.8).toLocaleString('es-AR')}</td><td style={{color:'#92400e'}}>${(s.total * 0.2).toLocaleString('es-AR')}</td><td style={{fontSize: '11px'}}>${(s.alquilerVal * 0.8).toLocaleString('es-AR')} /${(s.alquilerVal * 0.2).toLocaleString('es-AR')}</td><td style={{fontWeight:700, color: '#1a56db'}}>${((s.total * 0.8) - (s.alquilerVal * 0.8)).toLocaleString('es-AR')}</td><td><button className="btn btn-xs btn-danger" onClick={()=>deleteSession(s.id)}>✕</button></td></tr>))}</tbody></table></div></div>
    </div>
  );
}

function ConfigModule({db,setDB}){

  const[geminiKey, setKey] = useState(getGeminiKey()); const saveKey = () => { setGeminiKey(geminiKey); setMsg('API Key guardada en este navegador.'); };

  function add(key,val,setter){ const v=val.trim(); if(!v)return; if(db[key].includes(v)){setMsg(`"${v}" ya existe`);return} setDB({...db,[key]:sortArr([...db[key],v])}); setter('');setMsg(`Agregado`); }
  async function remove(key,val){ const ok = await showConfirm({title: 'Eliminar', message: `¿Eliminar "${val}"?`, isDanger: true}); if(!ok) return; setDB({...db,[key]:db[key].filter(x=>x!==val)}); }

  function exportDB(){ const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;a.download=`mcp_bolivar_${todayStr().replace(/\//g,'-')}.json`;a.click(); setMsg('Respaldo descargado'); }

  function importDB(e) {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data.patients)) throw new Error('Formato inválido: falta la lista de pacientes');
        setDB(data); setMsg(`Importado exitosamente: ${data.patients.length} pacientes subidos a Firestore.`);
      } catch (err) { setMsg('Error: ' + err.message); }
    }; r.readAsText(f); e.target.value = '';
  }

  return(
    <div>
      {msg&&<div className="alert alert-success" onClick={()=>setMsg('')} style={{cursor:'pointer'}}>✓ {msg}</div>}
      <div className="card" style={{borderLeft: '4px solid #8b5cf6'}}>
        <div className="card-title">🤖 IA (Informes)</div><div style={{display:'flex', gap:10}}><input type="password" value={geminiKey} onChange={e=>setKey(e.target.value)} placeholder="API Key..." style={{flex:1}}/><button className="btn btn-primary" onClick={saveKey}>Guardar</button></div>
      </div>
      <div className="card"><div className="card-title">📦 Importar / Exportar Nube</div><div style={{display:'flex',gap:8,marginBottom:'.75rem'}}><button className="btn btn-success" onClick={exportDB}>⬇ Exportar</button><label className="btn">⬆ Subir a la Nube<input type="file" accept=".json" onChange={importDB} style={{display:'none'}}/></label></div></div>
      <div className="grid2">
        {[{label:'Ciudades',key:'cities',val:newCity,set:setNewCity,ph:'Nueva'},{label:'Marcas',key:'brands',val:newBrand,set:setNewBrand,ph:'Nueva'},{label:'Tipos',key:'deviceTypes',val:newType,set:setNewType,ph:'Nuevo'}].map(({label,key,val,set,ph})=>(
          <div className="card" key={key}><div className="card-title">{label}</div><div style={{display:'flex',gap:6,marginBottom:'.75rem'}}><input value={val} onChange={e=>set(e.target.value)} placeholder={ph}/><button className="btn btn-primary btn-sm" onClick={()=>add(key,val,set)}>+</button></div><div style={{display:'flex',flexWrap:'wrap',gap:5}}>{db[key].map(x=>( <span key={x} className="chip" style={{cursor:'pointer'}} onClick={()=>remove(key,x)}>{x} ×</span> ))}</div></div>
        ))}
      </div>
    </div>
  );
}

function PrintListModal({patients, onClose, onlyParticulares = false}){
  // Si estamos en modo particulares, filtramos los que tengan el tilde y no hayan fallecido
  const list = onlyParticulares 
    ? patients.filter(p => p.particular && !p.fallecido)
    : patients;

  const formatMonthYear = (dateStr) => {
    if (!dateStr || dateStr === 'Sin control' || dateStr.includes('Sin')) return 'Sin control';
    const parts = dateStr.split('/');
    if (parts.length < 3) return dateStr;
    const [d, m, y] = parts;
    const date = new Date(y, m - 1, d);
    if (isNaN(date.getTime())) return dateStr;
    const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    return `${months[date.getMonth()]} ${date.getFullYear()}`;
  };

  return(
    <div className="modal-overlay no-print">
      <div className="modal modal-lg print-modal-container">
        <div className="modal-header">
          <span className="modal-title">
            {onlyParticulares ? '🏠 Hoja de Ruta — Controles a Domicilio' : 'Lista Imprimible de Pacientes'}
          </span>
          <button className="btn btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body print-body-reset">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}} className="no-print">
            <span style={{fontSize:13,color:'#718096'}}>Total: {list.length} pacientes · {todayStr()}</span>
            <button className="btn btn-primary btn-sm" onClick={()=>window.print()}>🖨 Imprimir</button>
          </div>
          
          <div className="print-area">
            {onlyParticulares && (
              <div style={{marginBottom: '15px', borderBottom: '2px solid #1a56db', paddingBottom: '8px'}}>
                <h2 style={{fontSize: '18px', color: '#1a56db', margin: 0}}>MCP Bolívar — Controles a Domicilio (Particulares)</h2>
                <span style={{fontSize: '12px', color: '#718096'}}>Fecha de salida: {todayStr()}</span>
              </div>
            )}

            <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '12px'}}>
              <thead>
                <tr style={{background: '#f7fafc', textAlign: 'left'}}>
                  <th style={{padding: '8px', width: '30px'}}>#</th>
                  <th style={{padding: '8px'}}>Apellido y Nombre</th>
                  <th style={{padding: '8px'}}>Dirección</th>
                  <th style={{padding: '8px'}}>Teléfono / Contacto</th>
                  <th style={{padding: '8px'}}>Marca / Disp.</th>
                  {!onlyParticulares && <th style={{padding: '8px'}}>Últ. Control</th>}
                </tr>
              </thead>
              <tbody>
                {list.map((p,i)=>(
                  <tr key={p.id} style={{pageBreakInside: 'avoid'}}>
                    <td style={{borderBottom: '1px solid #edf2f7', padding: '8px', color: '#718096'}}>{i+1}</td>
                    <td style={{borderBottom: '1px solid #edf2f7', padding: '8px', fontWeight:600}}>
                      <span style={{textDecoration: p.fallecido ? 'line-through' : 'none'}}>{p.apellido}, {p.nombre}</span>
                      {p.particular && <span className="badge badge-yellow" style={{marginLeft: 4, fontSize: '9px'}}>Particular</span>}
                      {p.fallecido && <span style={{marginLeft: '6px', color: '#c53030', fontSize: '9px'}}>FALLECIDO</span>}
                    </td>
                    <td style={{borderBottom: '1px solid #edf2f7', padding: '8px', fontWeight: 500}}>
                      {`${p.street || ''} ${p.streetNum || ''}`.trim() || '—'} 
                      <span style={{fontSize: '11px', color: '#718096', display: 'block'}}>{p.city}</span>
                    </td>
                    <td style={{borderBottom: '1px solid #edf2f7', padding: '8px'}}>
                      {p.telPrefix} {p.telNum}
                      <span style={{fontSize: '11px', color: '#718096', display: 'block'}}>
                        {p.telOwner !== 'Paciente' ? `${p.telOwner}: ${p.telContact}` : '(Paciente)'}
                      </span>
                    </td>
                    <td style={{borderBottom: '1px solid #edf2f7', padding: '8px'}}>
                      <strong>{p.brand || '—'}</strong>
                      <span style={{fontSize: '11px', color: '#718096', display: 'block'}}>{p.deviceType}</span>
                    </td>
                    {!onlyParticulares && (
                      <td style={{borderBottom: '1px solid #edf2f7', padding: '8px'}}>{formatMonthYear(lastConsulta(p))}</td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        <div className="modal-footer no-print">
          <button className="btn" onClick={onClose}>Cerrar</button>
          <button className="btn btn-primary" onClick={()=>window.print()}>🖨 Imprimir</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const { showConfirm, showAlert } = useDialog();
  const [role, setRole] = useState(() => localStorage.getItem('mcp_role') || null);
  const [db, setDBRaw] = useState(null);
  const [loading, setLoading] = useState(true);

  const[view,setView]=useState('patients');
  const[search,setSearch]=useState('');
  const[showNew,setShowNew]=useState(false);
  const[selectedId,setSelectedId]=useState(null);
  const[editPatient,setEditPatient]=useState(null);
  const[showPrint,setShowPrint]=useState(false);
  const[showWaList,setShowWaList]=useState(false);
  const[sortBy, setSortBy] = useState('name'); 
  const[autoOpenConsulta, setAutoOpenConsulta] = useState(false);
  const[printParticularesOnly, setPrintParticularesOnly] = useState(false);

  useEffect(() => {
    if (!role) return;
    const unsubscribe = firestore.collection('mcp').doc('main').onSnapshot(doc => {
      if (doc.exists) {
        setDBRaw(doc.data());
      } else {
        setDBRaw({...DEFAULT});
        if(role === 'admin') firestore.collection('mcp').doc('main').set({...DEFAULT});
      }
      setLoading(false);
    }, err => {
      console.error(err);
      showAlert({title: "Error de conexión", message: "Problemas al conectar con Firestore."});
    });
    return () => unsubscribe();
  }, [role]);

  function setDB(newDB){
    setDBRaw(newDB); 
    if(role === 'admin') {
      firestore.collection('mcp').doc('main').set(newDB).catch(err => {
        console.error(err);
        showAlert({title: "Error", message: "No se pudieron sincronizar los datos en la nube."});
      });
    }
  }

  const handleAfterSave = async (id) => {
    setShowNew(false); setEditPatient(null);
    if (id && role === 'admin') {
      const ok = await showConfirm({ title: 'Guardado', message: '¿Deseas agregar una nueva consulta ahora?', confirmText: '+ Consulta' });
      if (ok) { setSelectedId(id); setAutoOpenConsulta(true); }
    }
  };

  const parseDateForSort = (dateStr) => { if (!dateStr || dateStr === 'Sin control') return 0; const [d, m, y] = dateStr.split('/'); return new Date(y, m - 1, d).getTime(); };

  const sorted = useMemo(() => {
    if(!db) return [];
    return [...db.patients].sort((a, b) => {
      if (a.fallecido && !b.fallecido) return 1; if (!a.fallecido && b.fallecido) return -1;
      if (sortBy === 'brand') { const r = (a.brand || 'Z').localeCompare(b.brand || 'Z', 'es'); if (r !== 0) return r; } 
      else if (sortBy === 'date') { const dA = parseDateForSort(lastConsulta(a)); const dB = parseDateForSort(lastConsulta(b)); if (dA !== dB) return dB - dA; }
      return (a.apellido + a.nombre).localeCompare(b.apellido + b.nombre, 'es');
    });
  }, [db?.patients, sortBy]);

  const filtered=useMemo(()=>{
    const q=search.trim().toLowerCase(); if(!q)return sorted;
    return sorted.filter(p=> (p.apellido+' '+p.nombre).toLowerCase().includes(q));
  },[sorted,search]);

  if (!role) return <LoginScreen onLogin={(r) => { setRole(r); localStorage.setItem('mcp_role', r); }} />;
  if (loading || !db) {
    return (
      <div className="login-wrap">
        <div className="ecg-loader-wrap">
          <div className="ecg-heart-icon">❤️</div>
          
          <svg className="ecg-svg-box" viewBox="0 0 300 80">
            <path
              className="ecg-line"
              d="M 0,40 L 40,40 L 55,40 L 65,33 L 75,40 L 95,40 L 105,52 L 120,8 L 135,68 L 145,40 L 165,40 L 180,28 L 200,40 L 300,40"
            />
          </svg>

          <span className="ecg-label">Sincronizando MCP Bolívar...</span>
        </div>
      </div>
    );
  }

  return(
    <div className="app">
      {showNew && role === 'admin' && <PatientForm db={db} setDB={setDB} onClose={handleAfterSave}/>}
      {editPatient && role === 'admin' && <PatientForm db={db} setDB={setDB} patient={editPatient} onClose={handleAfterSave}/>}
      {showWaList && <WhatsAppListModal patients={sorted} onClose={()=>setShowWaList(false)}/>}
      
      {selectedId && !editPatient && (
        <PatientDetail patientId={selectedId} db={db} setDB={setDB} role={role} onClose={() => {setSelectedId(null); setAutoOpenConsulta(false);}} onEdit={p => {setSelectedId(null); setEditPatient(p);}} initialOpenConsulta={autoOpenConsulta}/>
      )}
      
      {/* MODAL DE IMPRESIÓN CON FILTRO DE PARTICULARES */}
      {showPrint && (
        <PrintListModal 
          patients={sorted} 
          onlyParticulares={printParticularesOnly} 
          onClose={() => { setShowPrint(false); setPrintParticularesOnly(false); }}
        />
      )}

      <nav className="navbar">
        <div className="nav-logo">
          <img src="logo_mcp.png" alt="Logo" style={{width: 30, height: 30, borderRadius: '50%'}} /> 
          MCP Bolívar
        </div>

        {/* ACCESO A LA AGENDA (VISIBLE PARA ADMIN Y SECRETARIA) */}
        <button 
          className="btn btn-sm" 
          style={{background: 'rgba(255,255,255,0.2)', color: '#fff', border: '1px solid rgba(255,255,255,0.35)', marginLeft: '8px'}}
          onClick={() => window.open('agenda.html', '_blank')}
        >
          📋 Agenda y Confirmaciones
        </button>

        {/* WHATSAPP EN NAVBAR: SOLO PARA SECRETARIA */}
        {role === 'secre' && (
          <button 
            className="btn btn-sm btn-success" 
            style={{marginLeft: '8px'}}
            onClick={() => setShowWaList(true)}
          >
            📱 WhatsApp
          </button>
        )}
        
        {/* ELEMENTOS DE ESCRITORIO (SOLO ADMIN EN PC) */}
        {role === 'admin' && (
          <div className="desktop-nav-items" style={{display: 'flex', alignItems: 'center', gap: '8px', marginLeft: 'auto'}}>
            <button className={`nav-btn ${view === 'patients' ? 'active' : ''}`} onClick={()=>setView('patients')}>👥 Pacientes</button>
            <button className={`nav-btn ${view === 'finances' ? 'active' : ''}`} onClick={()=>setView('finances')}>💼 Finanzas</button>
            <button className={`nav-btn ${view === 'config' ? 'active' : ''}`} onClick={()=>setView('config')}>⚙ Config</button>
            <button className="nav-new" onClick={()=>setShowNew(true)}><span>👤</span>+ Nuevo</button>
            <button className="nav-btn" style={{background: 'rgba(255,0,0,0.2)', marginLeft: '6px'}} onClick={()=>{setRole(null); localStorage.removeItem('mcp_role');}}>Salir</button>
          </div>
        )}

        {/* ACCIONES COMPACTAS PARA CELULAR */}
        <div style={{display: 'flex', alignItems: 'center', gap: '6px', marginLeft: role !== 'admin' ? 'auto' : '6px'}}>
          {role === 'admin' && (
            <>
              {/* Botón "+ Nuevo" exclusivo móvil (en PC está oculto por CSS) */}
              <button className="nav-new mobile-menu-btn" style={{padding: '5px 10px', fontSize: '12px'}} onClick={()=>setShowNew(true)}>
                + Nuevo
              </button>
              
              {/* Menú hamburguesa (Cerrar Sesión está adentro del desplegable) */}
              <button 
                className="btn btn-sm mobile-menu-btn" 
                style={{background: 'rgba(255,255,255,0.15)', color: '#fff', border: '1px solid rgba(255,255,255,0.3)', padding: '6px 10px'}}
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
              >
                {mobileMenuOpen ? '✕' : '☰'}
              </button>
            </>
          )}

          {/* Salir para la secretaria (no tiene hamburguesa) */}
          {role === 'secre' && (
            <button 
              className="btn btn-sm" 
              style={{background: 'rgba(255,0,0,0.2)', color: '#fff', border: 'none', padding: '5px 10px'}}
              onClick={()=>{setRole(null); localStorage.removeItem('mcp_role');}}
            >
              Salir
            </button>
          )}
        </div>
      </nav>

      {/* MENÚ DESPLEGABLE MÓVIL (SOLO ADMIN) */}
      {mobileMenuOpen && role === 'admin' && (
        <div className="mobile-menu-drawer">
          <button 
            className={`nav-btn ${view === 'patients' ? 'active' : ''}`} 
            onClick={() => { setView('patients'); setMobileMenuOpen(false); }}
          >
            👥 Pacientes
          </button>
          <button 
            className={`nav-btn ${view === 'finances' ? 'active' : ''}`} 
            onClick={() => { setView('finances'); setMobileMenuOpen(false); }}
          >
            💼 Finanzas
          </button>
          <button 
            className={`nav-btn ${view === 'config' ? 'active' : ''}`} 
            onClick={() => { setView('config'); setMobileMenuOpen(false); }}
          >
            ⚙ Configuración
          </button>
          <div style={{height: '1px', background: 'rgba(255,255,255,0.15)', margin: '4px 0'}}></div>
          <button 
            className="nav-btn" 
            style={{background: 'rgba(239,68,68,0.25)', color: '#fca5a5'}}
            onClick={() => { setRole(null); localStorage.removeItem('mcp_role'); }}
          >
            🚪 Cerrar Sesión
          </button>
        </div>
      )}

      <div className="main">
        {view==='patients'&&(
          <>
            <div className="card" style={{marginBottom: '0.75rem'}}>
              <div className="filter-bar-mobile">
                <div className="search-wrap" style={{flex:1,minWidth:220}}>
                  <span className="search-icon">🔍</span>
                  <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por apellido o nombre..." autoFocus/>
                </div>
                
                <div className="filter-actions-mobile">
                  <div style={{display: 'flex', background: '#f1f5f9', padding: '3px', borderRadius: '8px', border: '0.5px solid #e2e8f0'}}>
                    <button onClick={() => setSortBy('name')} style={{padding: '4px 8px', fontSize: '11px', borderRadius: '6px', border: 'none', background: sortBy === 'name' ? '#fff' : 'transparent', fontWeight: sortBy === 'name' ? '700' : '500', color: sortBy === 'name' ? '#1a56db' : '#64748b'}}>AZ</button>
                    <button onClick={() => setSortBy('brand')} style={{padding: '4px 8px', fontSize: '11px', borderRadius: '6px', border: 'none', background: sortBy === 'brand' ? '#fff' : 'transparent', fontWeight: sortBy === 'brand' ? '700' : '500', color: sortBy === 'brand' ? '#1a56db' : '#64748b'}}>🏷️</button>
                    <button onClick={() => setSortBy('date')} style={{padding: '4px 8px', fontSize: '11px', borderRadius: '6px', border: 'none', background: sortBy === 'date' ? '#fff' : 'transparent', fontWeight: sortBy === 'date' ? '700' : '500', color: sortBy === 'date' ? '#1a56db' : '#64748b'}}>📅</button>
                  </div>
                  
                  <span className="badge badge-blue" style={{fontSize:11, padding:'4px 8px'}}>{filtered.length} pac.</span>
                  
                  {/* WhatsApp visible para ambos */}
                  <button className="btn btn-sm btn-success" onClick={()=>setShowWaList(true)}>📱 WhatsApp</button>
                  
                  {/* Particulares e Imprimir exclusivos tuyos (Admin) */}
                  {role === 'admin' && (
                    <>
                      <button className="btn btn-sm btn-info" onClick={()=>{ setPrintParticularesOnly(true); setShowPrint(true); }}>🏠 Particulares</button>
                      <button className="btn btn-sm" onClick={()=>{ setPrintParticularesOnly(false); setShowPrint(true); }}>🖨 Imprimir</button>
                    </>
                  )}
                </div>
              </div>
            </div>

            {/* TABLA ESCRITORIO */}
            <div className="card desktop-table" style={{padding:0, overflow:'hidden'}}>
              <div className="table-wrap">
                <table>
                  <thead><tr><th>Paciente</th><th>Edad</th><th>Ciudad</th><th>Dispositivo</th><th>Marca</th><th>Batería</th><th>Último Control</th></tr></thead>
                  <tbody>
                    {filtered.map(p=>(
                      <tr key={p.id} className="patient-row" onClick={()=>setSelectedId(p.id)} style={{opacity: p.fallecido ? 0.6 : 1, background: p.fallecido ? '#f7fafc' : 'inherit'}}>
                        <td>
                          <div style={{display:'flex',alignItems:'center',gap:8}}>
                            <div style={{width:30,height:30,borderRadius:'50%',background: p.fallecido ? '#e2e8f0' : '#ebf4ff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color: p.fallecido ? '#718096' : '#1a56db'}}>{p.apellido[0]}{p.nombre[0]}</div>
                            <span style={{fontWeight:600, textDecoration: p.fallecido ? 'line-through' : 'none', color: p.fallecido ? '#718096' : 'inherit'}}>{p.apellido}, {p.nombre}</span>
                            {/* BADGES PARTICULARES Y FALLECIDO */}
                            {p.particular && <span className="badge badge-yellow" style={{marginLeft: 4, padding: '1px 6px', fontSize: '9px'}}>Particular</span>}
                            {p.fallecido && <span className="badge badge-red" style={{marginLeft: 4, padding: '1px 6px', fontSize: '9px'}}>Fallecido</span>}
                          </div>
                        </td>
                        <td>{calcAge(p.dob)??'—'}</td><td style={{color:'#718096'}}>{p.city||'—'}</td><td>{p.deviceType||'—'}</td>
                        <td style={{fontWeight: sortBy === 'brand' ? '700' : 'normal', color: sortBy === 'brand' ? '#1a56db' : 'inherit'}}>{p.brand||'—'}</td>
                        <td><span className={`badge ${batteryColor(p)}`}>{batteryDisplay(p)}</span></td>
                        <td style={{fontWeight: sortBy === 'date' ? '700' : 'normal', color: sortBy === 'date' ? '#1a56db' : '#718096', fontSize:12}}>{lastConsulta(p)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* TARJETAS MÓVILES */}
            <div className="mobile-cards-list">
              {filtered.map(p => (
                <div key={p.id} className="mobile-patient-card" onClick={()=>setSelectedId(p.id)} style={{opacity: p.fallecido ? 0.6 : 1}}>
                  <div className="mobile-card-header">
                    <div className="mobile-card-title">
                      <div style={{width:28, height:28, borderRadius:'50%', background: p.fallecido ? '#e2e8f0' : '#ebf4ff', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color: p.fallecido ? '#718096' : '#1a56db'}}>
                        {p.apellido[0]}{p.nombre[0]}
                      </div>
                      <span style={{textDecoration: p.fallecido ? 'line-through' : 'none', color: p.fallecido ? '#718096' : '#1a202c'}}>
                        {p.apellido}, {p.nombre}
                      </span>
                    </div>
                    <div>
                      {p.particular && <span className="badge badge-yellow" style={{marginRight: 4, fontSize: '9px'}}>Part.</span>}
                      {p.fallecido ? (
                        <span className="badge badge-red">Fallecido</span>
                      ) : (
                        <span className={`badge ${batteryColor(p)}`}>{batteryDisplay(p)}</span>
                      )}
                    </div>
                  </div>

                  <div className="mobile-card-body">
                    <div>🏷️ <strong>Marca:</strong> {p.brand || '—'}</div>
                    <div>⚡ <strong>Tipo:</strong> {p.deviceType || '—'}</div>
                    <div>📍 <strong>Ciudad:</strong> {p.city || '—'}</div>
                    <div>📅 <strong>Control:</strong> {lastConsulta(p)}</div>
                  </div>
                </div>
              ))}
            </div>
          </>
        )}

        {view==='finances' && role === 'admin' && <><h2 style={{fontSize:18,marginBottom:'1rem'}}>💼 Finanzas</h2><FinanceModule db={db} setDB={setDB}/></>}
        {view==='config' && role === 'admin' && <><h2 style={{fontSize:18,marginBottom:'1rem'}}>⚙ Configuración</h2><ConfigModule db={db} setDB={setDB}/></>}
      </div>
      <footer style={{textAlign: 'center', padding: '1rem', fontSize: '12px', color: '#a0aec0'}}>Creado por Mariano Lumbreras · V {APP_VERSION}</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <DialogProvider>
    <App/>
  </DialogProvider>
);
</script>
</body>
</html>
